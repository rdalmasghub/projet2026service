# Intégration continue, à chaque push et pull request :
#   1. tests de book-service (Gradle)
#   2. construction de l'image Docker
#   3. sur la branche main, si les secrets sont configurés : publication sur le Docker Hub
#
# Secrets à créer dans GitHub (Settings > Secrets and variables > Actions) pour publier :
#   DOCKERHUB_USERNAME : votre pseudo Docker Hub
#   DOCKERHUB_TOKEN    : un "Personal Access Token" Docker Hub (Read & Write), jamais le mot de passe
name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  tests:
    name: Tests book-service
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "21"
      - uses: gradle/actions/setup-gradle@v6
      - name: Tests
        working-directory: book-service
        run: ./gradlew --no-daemon test

  image:
    name: Image Docker
    needs: tests
    runs-on: ubuntu-latest
    env:
      DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
      IMAGE: docker.io/${{ secrets.DOCKERHUB_USERNAME || 'ci' }}/bibliotheque-book-service
    steps:
      - uses: actions/checkout@v7
      - uses: docker/setup-buildx-action@v4
      - name: Construction de l'image
        uses: docker/build-push-action@v7
        with:
          context: book-service
          load: true
          tags: ${{ env.IMAGE }}:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: Connexion au Docker Hub
        if: github.event_name == 'push' && github.ref == 'refs/heads/main' && env.DOCKERHUB_USERNAME != ''
        uses: docker/login-action@v4
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
      - name: Publication
        if: github.event_name == 'push' && github.ref == 'refs/heads/main' && env.DOCKERHUB_USERNAME != ''
        run: |
          docker tag "$IMAGE:${{ github.sha }}" "$IMAGE:latest"
          docker push "$IMAGE:${{ github.sha }}"
          docker push "$IMAGE:latest"
