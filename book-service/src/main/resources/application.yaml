# Configuration de book-service.
spring:
  application:
    name: book-service
  datasource:
    # Base H2 en mémoire, comme le conseille le sujet pour commencer :
    # pas d'installation, les données sont recréées à chaque démarrage (voir DataInitializer).
    url: jdbc:h2:mem:books;DB_CLOSE_DELAY=-1
    username: sa
    password: ''
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: update
  h2:
    console:
      enabled: false
  threads:
    virtual:
      enabled: true

server:
  port: ${HTTP_PORT:8080}
  shutdown: graceful

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      probes:
        enabled: true   # /actuator/health/liveness et /actuator/health/readiness pour Kubernetes
  info:
    env:
      enabled: true

info:
  app:
    description: Catalogue de livres (API REST)

app:
  seed-data: ${SEED_DATA:true}
